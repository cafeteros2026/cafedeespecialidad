<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Café Especial | Si existe, está aquí</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #FFF8F0;
      --ink: #1E1B18;
      --coral: #FF5A36;
      --teal: #3ABEFF;
      --yellow: #FFD166;
      --purple: #C8963E;
      --card-bg: #FFFFFF;
      --border-thick: 3px solid var(--ink);
      --shadow-pop: 5px 5px 0px var(--ink);
      --shadow-hover: 8px 8px 0px var(--ink);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.5;
      padding: 20px;
    }

    /* HEADER / NAV */
    header {
      max-width: 1200px;
      margin: 0 auto 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      background: var(--yellow);
      border: var(--border-thick);
      box-shadow: var(--shadow-pop);
      border-radius: 16px;
    }

    .logo {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -1px;
    }

    .badge-header {
      background: var(--coral);
      color: #FFF;
      padding: 6px 14px;
      border: var(--border-thick);
      border-radius: 50px;
      font-weight: 800;
      font-size: 0.85rem;
      transform: rotate(-2deg);
    }

    /* HERO SECTION */
    .hero {
      max-width: 1200px;
      margin: 0 auto 50px;
      text-align: center;
      position: relative;
      padding: 40px 20px;
    }

    .hero-tag {
      display: inline-block;
      background: var(--teal);
      border: var(--border-thick);
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.9rem;
      box-shadow: 3px 3px 0px var(--ink);
      margin-bottom: 20px;
      transform: rotate(1.5deg);
    }

    .hero h1 {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: clamp(2.8rem, 7vw, 5.2rem);
      line-height: 0.95;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 20px;
      letter-spacing: -2px;
    }

   .hero h1 span {
  color: var(--coral);
  /* Eliminamos el text-shadow y el webkit-text-stroke */
}

    .hero p {
      font-size: clamp(1.2rem, 2.5vw, 1.6rem);
      font-weight: 700;
      max-width: 650px;
      margin: 0 auto 30px;
      background: #FFF;
      display: inline-block;
      padding: 8px 20px;
      border: var(--border-thick);
      box-shadow: 4px 4px 0px var(--ink);
      border-radius: 12px;
    }

    /* BUSCADOR POP */
    .search-container {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
      background: #FFF;
      padding: 12px;
      border: var(--border-thick);
      box-shadow: var(--shadow-pop);
      border-radius: 16px;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 10px 15px;
    }

    .search-btn {
      background: var(--coral);
      color: white;
      border: var(--border-thick);
      padding: 12px 28px;
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 1.2rem;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 3px 3px 0px var(--ink);
    }

    .search-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px var(--ink);
    }

    /* FILTROS RÁPIDOS */
    .filters {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      max-width: 900px;
      margin: 25px auto 0;
    }

    .filter-chip {
      background: #FFF;
      border: var(--border-thick);
      padding: 6px 14px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--ink);
      transition: transform 0.1s;
    }

    .filter-chip:hover {
      background: var(--yellow);
      transform: translateY(-2px);
    }

    /* GRID DE CAFÉS */
    .grid-container {
      max-width: 1200px;
      margin: 50px auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 30px;
    }

    /* TARJETA TIPO PAQUETE POP */
    .coffee-card {
      background: var(--card-bg);
      border: var(--border-thick);
      border-radius: 20px;
      box-shadow: var(--shadow-pop);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.2s ease;
      position: relative;
    }

    .coffee-card:hover {
      transform: translate(-3px, -3px);
      box-shadow: var(--shadow-hover);
    }

    .card-header-art {
      height: 180px;
      background: var(--teal);
      border-bottom: var(--border-thick);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Ilustración geométrica retro integrada con CSS */
    .art-shape-1 {
      position: absolute;
      width: 100px;
      height: 100px;
      background: var(--yellow);
      border: var(--border-thick);
      border-radius: 50%;
      top: -20px;
      left: -20px;
    }

    .art-shape-2 {
      position: absolute;
      width: 0; 
      height: 0; 
      border-left: 50px solid transparent;
      border-right: 50px solid transparent;
      border-bottom: 90px solid var(--coral);
      bottom: -10px;
      right: -10px;
      transform: rotate(15deg);
    }

    .origin-badge {
      position: relative;
      z-index: 2;
      background: #FFF;
      border: var(--border-thick);
      padding: 6px 16px;
      border-radius: 50px;
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 1.3rem;
      font-weight: 800;
      box-shadow: 3px 3px 0px var(--ink);
      transform: rotate(-3deg);
    }

    .card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .roaster-name {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--coral);
      letter-spacing: 0.5px;
    }

    .coffee-title {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 1.5rem;
      line-height: 1.1;
      margin: 4px 0 12px;
    }

    .tags-container {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .tag {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 3px 8px;
      border: 2px solid var(--ink);
      border-radius: 6px;
      background: var(--bg);
    }

    .notes-box {
      background: var(--bg);
      border: 2px dashed var(--ink);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .card-footer {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 2px solid #F0F0F0;
    }

    .price {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
    }

    .btn-buy {
      background: var(--yellow);
      color: var(--ink);
      border: var(--border-thick);
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.9rem;
      text-decoration: none;
      box-shadow: 2px 2px 0px var(--ink);
      transition: all 0.1s;
    }

    .btn-buy:hover {
      background: var(--coral);
      color: #FFF;
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px var(--ink);
    }
  </style>
</head>
<body>

  <!-- NAVEGACIÓN -->
  <header>
    <div class="logo">CaféRadar ☕</div>
    <div class="badge-header">+120 Tostadores</div>
  </header>

  <!-- HERO PRINCIPAL -->
  <section class="hero">
    <div class="hero-tag">El buscador definitivo de especialidad</div>
    <h1>Si existe, <span>está aquí</span></h1>
    <p>Busca. Encuentra. Pídelo.</p>

    <!-- BARRA DE BÚSQUEDA -->
    <div class="search-container">
      <input type="text" class="search-input" placeholder="Origen, tostador, notas (ej. Etiopía, Lavado, Melocotón)...">
      <button class="search-btn">BUSCAR</button>
    </div>

    <!-- FILTROS POPULARIDAD -->
    <div class="filters">
      <span class="filter-chip">🍓 Notas a Fruta</span>
      <span class="filter-chip">🍫 Chocolate y Frutos Secos</span>
      <span class="filter-chip">⚡ Espresso Filter</span>
      <span class="filter-chip">🏆 +86 SCA</span>
      <span class="filter-chip">🌱 Procesos Experimentales</span>
    </div>
  </section>

  <!-- LISTADO DE CAFÉS -->
<main class="grid-container" id="coffee-grid">
    <!-- El contenido se generará mediante JavaScript -->
  </main>

  <script>
    // Paleta de colores para asignar dinámicamente según el origen
    const COLORS = ['#3ABEFF', '#FFD166', '#FF5A36', '#C8963E'];

const COLORS = ['#3ABEFF', '#FFD166', '#FF5A36', '#C8963E'];

// Mapa estricto de orígenes y banderas
const FLAGS = {
  'ETIOPÍA': '🇪🇹', 'KENIA': '🇰🇪', 'COLOMBIA': '🇨🇴', 'BRASIL': '🇧🇷', 'GUATEMALA': '🇬🇹',
  'COSTA RICA': '🇨🇷', 'PERÚ': '🇵🇪', 'HONDURAS': '🇭🇳', 'EL SALVADOR': '🇸🇻', 'PANAMÁ': '🇵🇦',
  'RUANDA': '🇷🇼', 'BURUNDI': '🇧🇮', 'UGANDA': '🇺🇬', 'VENEZUELA': '🇻🇪', 'NICARAGUA': '🇳🇮',
  'MÉXICO': '🇲🇽', 'INDONESIA': '🇮🇩', 'TANZANIA': '🇹🇿', 'BOLIVIA': '🇧🇴', 'ECUADOR': '🇪🇨',
  'YEMEN': '🇾🇪', 'INDIA': '🇮🇳', 'PAPÚA NUEVA GUINEA': '🇵🇬', 'TAILANDIA': '🇹🇭', 'JAMAICA': '🇯🇲',
  'VIETNAM': '🇻🇳', 'LAOS': '🇱🇦', 'MALAWI': '🇲🇼', 'ZAMBIA': '🇿🇲', 'REPÚBLICA DOMINICANA': '🇩🇴',
  'HAWÁI': '🇺🇸', 'EEUU': '🇺🇸', 'ESTADOS UNIDOS': '🇺🇸', 'CONGO': '🇨🇩', 'FILIPINAS': '🇵🇭',
  'TIMOR ORIENTAL': '🇹🇱', 'MYANMAR': '🇲🇲', 'CHINA': '🇨🇳'
};

const PAISES_VALIDOS = Object.keys(FLAGS);

// Función para extraer solo países reales de un texto
function obtenerOrigenesLimpios(textoOrigen) {
  const textoUpper = (textoOrigen || '').toUpperCase();
  return PAISES_VALIDOS.filter(pais => textoUpper.includes(pais));
}

    async function loadCoffees() {
      try {
        const response = await fetch('cafes_db.csv');
        const data = await response.text();
        
        // Parsear CSV separado por punto y coma
        const rows = data.split('\n').filter(row => row.trim() !== '');
        const headers = rows[0].split(';');
        const grid = document.getElementById('coffee-grid');
        
        for (let i = 1; i < rows.length; i++) {
          const cols = rows[i].split(';');
          if (cols.length < 10) continue; // Evitar líneas vacías o rotas
          
          const coffee = {
            tostador: cols[0] || 'Desconocido',
            nombre: cols[2],
            precio: parseFloat(cols[3] || 0).toFixed(2),
            gramos: cols[4] || '250',
            origen: (cols[5] || 'BLEND').toUpperCase(),
            proceso: (cols[6] || 'LAVADO').toUpperCase(),
            notas: cols[7] || 'Sin notas descriptivas',
            sca: cols[8] ? `SCA ${cols[8]}` : '',
            url: cols[9],
            disponible: cols[11] === '1'
          };

          if (!coffee.disponible) continue;

          // Asignar colores aleatorios del diseño pop art para mantener la estética
          const mainColor = COLORS[i % COLORS.length];
          const secondaryColor = COLORS[(i + 1) % COLORS.length];

          const article = document.createElement('article');
          article.className = 'coffee-card';
          const origenesReales = obtenerOrigenesLimpios(cols[5]);
          let tagsOrigen = '';
          
          if (origenesReales.length > 0) {
            tagsOrigen = origenesReales.map(pais => {
              // Capitalizar correctamente el nombre (ej. "Etiopía")
              const nombreBonito = pais.charAt(0) + pais.slice(1).toLowerCase();
              return `<span class="tag">${FLAGS[pais]} ${nombreBonito}</span>`;
            }).join('');
          } else if ((cols[5] || '').toUpperCase().includes('BLEND')) {
            // Opcional: mostrar un icono genérico si detectamos un Blend real
            tagsOrigen = `<span class="tag">🌍 Blend</span>`; 
          }

          const article = document.createElement('article');
          article.className = 'coffee-card';
          article.innerHTML = `
            <div class="card-header-art" style="background: ${mainColor};">
              <div class="art-shape-1" style="background: ${secondaryColor};"></div>
              <div class="art-shape-2"></div>
              <!-- La etiqueta central ha sido eliminada -->
            </div>
            <div class="card-body">
              <span class="roaster-name">${coffee.tostador}</span>
              <h2 class="coffee-title">${coffee.nombre}</h2>
              <div class="tags-container">
                ${tagsOrigen}
                <span class="tag" style="background: ${secondaryColor};">${coffee.proceso}</span>
                <span class="tag">${coffee.gramos}g</span>
                ${coffee.sca ? `<span class="tag">${coffee.sca}</span>` : ''}
              </div>
              <div class="notes-box">
                ${coffee.notas.split(',').slice(0,3).join(' · ')}
              </div>
              <div class="card-footer">
                <span class="price">${coffee.precio}€</span>
                <a href="${coffee.url}" target="_blank" class="btn-buy">Ver Café</a>
              </div>
            </div>
          `;
          grid.appendChild(article);
        }
      } catch (error) {
        console.error('Error cargando los cafés:', error);
      }
    }

    loadCoffees();
  </script>

</body>
</html>
