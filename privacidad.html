  <!-- 1. Política de Privacidad

Última actualización: Octubre de 2026

En Café Radar nos tomamos muy en serio la privacidad de los usuarios. Esta Política de Privacidad explica qué datos recopilamos, con qué finalidad y cuáles son tus derechos en virtud del Reglamento General de Protección de Datos (RGPD) y la Ley Orgánica de Protección de Datos y Garantía de los Derechos Digitales (LOPD-GDD).
1. Responsable del Tratamiento

    Titular / Proyecto: [Tu Nombre o el nombre de tu proyecto]

    Correo de contacto: [caferadar@outlook.es]

    Sitio web: [[https://tu-dominio.com](https://caferadar.es)]

2. ¿Qué datos recopilamos y con qué finalidad?

Café Radar es un buscador informativo de cafés de especialidad. En nuestra web:

    No exigimos registro ni creaciones de cuentas: Los usuarios pueden navegar, buscar y filtrar libremente sin facilitar datos personales (como nombre, DNI o contraseña).

    Registro anónimo de clics: Cuando haces clic en el botón "Ver Café" para visitar la tienda original del tostador, nuestro sistema registra de forma totalmente anónima el nombre del tostador y del café seleccionado para medir el interés general de los usuarios y mejorar el catálogo. Este registro no almacena direcciones IP, perfiles de usuario ni datos identificativos.

3. Legitimación para el tratamiento de datos

El tratamiento de los datos anónimos de interacción se realiza en base al interés legítimo de ofrecer un servicio de búsqueda funcional, optimizar la plataforma y analizar de forma estadística qué productos generan mayor interés en el sector del café de especialidad.
4. Cesión de datos a terceros

Tus datos de navegación no se ceden, venden ni comparten con ninguna empresa de publicidad ni terceros. Los enlaces de los productos redirigen directamente a las webs oficiales de los respectivos tostadores, momento en el cual se aplicarán las políticas de privacidad de cada tienda externa.
5. Tus derechos

Como usuario, tienes derecho a:

    Acceso: Conocer si tratamos datos relacionados contigo.

    Supresión y Oposición: Solicitar que no se procese información asociada a tu navegación.

    Reclamación: Si consideras que se vulnera tus derechos, puedes presentar una reclamación ante la Agencia Española de Protección de Datos (AEPD).

Para ejercer cualquier derecho, puedes escribirnos a [caferadar@outlook.es]. -->
