  <!-- 2. Política de Cookies

Última actualización: Octubre de 2026

Una cookie es un pequeño archivo de texto que se almacena en tu navegador cuando visitas casi cualquier sitio web. Su utilidad es que la web sea capaz de recordar tu visita cuando vuelvas a navegar por ella.
1. ¿Utiliza cookies Café Radar?

No. Café Radar ha sido diseñada para respetar al máximo la privacidad de los visitantes:

    No utilizamos cookies de análisis ni de publicidad: No empleamos herramientas de rastreo invasivas ni cookies de terceros (como Google Analytics).

    No recopilamos perfiles de usuario: Nuestra web funciona mediante scripts locales que procesan los filtros de búsqueda directamente en tu navegador y registran de forma anónima los clics comerciales sin almacenar identificadores en tu dispositivo.

2. Cookies técnicas o de sesión

Excepcionalmente, el servidor de alojamiento o el navegador podrían utilizar pequeñas preferencias técnicas estrictamente necesarias para el correcto funcionamiento visual de la página, las cuales no requieren el consentimiento previo del usuario según la normativa vigente.
3. ¿Cómo puedes controlar las cookies desde tu navegador?

Aunque nuestra web no instala cookies de seguimiento, puedes configurar tu navegador en cualquier momento para bloquear o eliminar cualquier archivo de cookies de internet de forma general:

    Google Chrome: Configuración > Privacidad y seguridad > Cookies y otros datos de sitios.

    Mozilla Firefox: Opciones > Privacidad y seguridad > Historial > Configuración personalizada.

    Apple Safari: Preferencias > Privacidad.

    Microsoft Edge: Configuración > Privacidad, búsqueda y servicios. -->
