name: Actualización Automática de Catálogo Granos

on:
  schedule:
    - cron: '0 3 * * *' # Ejecuta todos los días a las 03:00 UTC
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v3

      - name: Configurar entorno Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas

      - name: Ejecutar Scraper
        run: python scraper.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "Granos Bot"
          git config --global user.email "bot@granos.app"
          git add cafes.json estado.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-actualización de catálogo [skip ci]" && git push)
